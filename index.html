<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1f7a35" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Bouskimatch</title>
    <style>
      html, body {
        margin: 0; height: 100%; overflow: hidden; background: #1f7a35;
        touch-action: none; user-select: none; -webkit-user-select: none;
        -webkit-touch-callout: none; overscroll-behavior: none;
        font-family: 'Trebuchet MS', 'Arial Rounded MT Bold', Arial, sans-serif;
      }
      #game { position: fixed; inset: 0; }
      #fs {
        position: fixed; top: 10px; right: 10px; z-index: 5; display: none;
        width: 44px; height: 44px; border-radius: 12px; border: 0;
        background: rgba(0, 0, 0, .35); color: #fff; font-size: 24px;
      }
      #rotate {
        position: fixed; inset: 0; z-index: 10; display: none;
        background: #1f7a35; color: #fff; text-align: center;
        align-items: center; justify-content: center; flex-direction: column;
        font-size: 22px; font-weight: bold;
      }
      #rotate .icon { font-size: 90px; animation: turn 1.6s ease-in-out infinite; }
      @keyframes turn { 0%, 20% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
      @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <button id="fs" aria-label="Plein écran">⛶</button>
    <div id="rotate"><div class="icon">📱</div><div>Tourne ton téléphone !</div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
